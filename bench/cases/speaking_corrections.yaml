# Etykiety napisał jeden autor (AI, inny model niż oceniający Qwen3) PRZED uruchomieniem nowej polityki na `held`;
# to NIE jest złoty standard, dopóki człowiek ich nie zrecenzuje. Nie zastępować recenzji człowieka oceną modelu.
#
# Podział: dev — wolno oglądać wyniki i stroić reguły; held — tylko końcowa weryfikacja (przed/po tym samym kodem
# pomiaru), bez zmian reguł na podstawie wyników held. SHA-256 pliku w raporcie SMART_SPEAKING_CORRECTIONS_REPORT.md.
#
# kind:  clean | bre | ame | minor | grammar | serious | stt | bait
#   clean/bre/ame — poprawne; każda interwencja w rozmowie = fałszywa
#   minor   — drobny błąd, zrozumiały (przyimek, rodzajnik, kolokacja, styl): w rozmowie NIE przerywamy
#   grammar — wyraźny błąd gramatyczny bez zmiany sensu: delikatny recast dopuszczalny, natychmiastowa korekta nie
#   serious — błąd zmieniający sens / utrudniający zrozumienie: oczekiwana natychmiastowa korekta z `fix_has`
#   stt     — podejrzenie błędu rozpoznania mowy (mode voice, low = niepewne słowa): bez błędu ucznia w rozmowie
#   bait    — zdanie, w którym pojedyncza zamiana słowa nie daje poprawnego zdania (przypadki A/C/E właściciela):
#             natychmiastowa korekta pojedynczego słowa = fałszywa interwencja
# fix_has: forma, którą musi zawierać poprawka, by uznać wykrycie (alternatywy przez „|”)
