[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-ai-tutor"
version = "0.1.0"
description = "Free, local-first AI language tutor with voice conversation and adaptive learning."
readme = "README.md"
requires-python = ">=3.12"
# numpy: tryb tekstowy (--no-audio) też przechodzi przez potok audio (SimSink, SilentTTS).
dependencies = ["requests>=2.32", "pydantic>=2.7", "PyYAML>=6", "fsrs>=6", "numpy>=2"]

[project.optional-dependencies]
# Voice conversation: faster-whisper (MIT) STT + Kokoro (Apache-2.0) TTS.
voice = ["numpy>=2", "sounddevice>=0.5", "faster-whisper>=1.1", "kokoro-onnx>=0.4"]
# Optional alternative TTS. piper-tts is GPL-3.0: kept out of "voice" on purpose.
piper = ["piper-tts>=1.3"]
# Optional cloud provider (off by default; needs an API key and explicit per-profile consent).
gemini = ["google-genai>=1.0"]
# Tests import numpy and google-genai at module level.
dev = ["pytest>=8", "ruff>=0.6", "numpy>=2", "google-genai>=1.0"]

[tool.setuptools.packages.find]
include = ["tutor*"]

[tool.setuptools.package-data]
"tutor.store" = ["migrations/*.sql"]
"tutor.content" = ["**/*.yaml", "**/*.md", "**/*.csv"]
"tutor.gui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: needs a running Ollama / Gemini key (may cost money); run: pytest -m live"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "E702", "B007", "B008"]
