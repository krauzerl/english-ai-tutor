[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-ai-tutor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "pydantic>=2.7", "google-genai>=1.0", "PyYAML>=6", "fsrs>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# piper-tts jest GPL-3.0; Kokoro (Apache-2.0 + MIT) wystarczy do działania — usuń piper, jeśli licencja przeszkadza
voice = ["numpy>=2", "sounddevice>=0.5", "faster-whisper>=1.1", "kokoro-onnx>=0.4", "piper-tts>=1.3"]

[tool.setuptools.packages.find]
include = ["tutor*"]

[tool.setuptools.package-data]
"tutor.store" = ["migrations/*.sql"]
"tutor.content" = ["**/*.yaml", "**/*.md", "**/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: wymaga działającej Ollamy / klucza Gemini (kosztuje); uruchom: pytest -m live"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "E702", "B007", "B008"]
